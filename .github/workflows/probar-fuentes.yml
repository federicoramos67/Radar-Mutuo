name: Probar fuentes

on:
  push:
    branches: [main]
    paths: ["diagnostico/probar_fuentes.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diagnostico/probar_fuentes.py
      - run: |
          git config user.name "radar-mutuo[bot]"
          git config user.email "radar-mutuo@users.noreply.github.com"
          git add diagnostico/fuentes.json
          git diff --cached --quiet || git commit -m "Diagnóstico de fuentes candidatas"
          git pull --rebase origin main && git push

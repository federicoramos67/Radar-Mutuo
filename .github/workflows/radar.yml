name: Radar diario

on:
  schedule:
    - cron: "18 10 * * *"   # 07:18 en Montevideo (UTC-3), todos los días
  workflow_dispatch:         # botón para correrlo a mano cuando quieras
  push:                      # y cada vez que cambia el código
    branches: [main]
    paths: ["radar/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write   # guardar la edición y publicar la página

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Armar el brief
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m radar

      - name: Guardar la edición en el historial
        run: |
          git config user.name "radar-mutuo[bot]"
          git config user.email "radar-mutuo@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Edición del $(TZ=America/Montevideo date +%F)"
          git pull --rebase --autostash origin main && git push

      - name: Publicar la página
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: "Publicar edición"

name: Traer archivos

# Baja a media/ los archivos listados en media/descargas.txt (una línea: URL nombre-de-archivo).
on:
  push:
    branches: [main]
    paths: ["media/descargas.txt"]

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          while read -r url nombre; do
            [ -z "$url" ] && continue
            curl -fsSL "$url" -o "media/$nombre"
          done < media/descargas.txt
      - name: Guardar
        run: |
          git config user.name "radar-mutuo[bot]"
          git config user.email "radar-mutuo@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -m "Agregar archivos descargados"
          git pull --rebase origin main && git push

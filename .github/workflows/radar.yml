name: Radar diario

on:
  schedule:
    - cron: "18 10 * * *"   # 07:18 en Montevideo (UTC-3), todos los días
  workflow_dispatch:         # botón para correrlo a mano cuando quieras

permissions:
  contents: write   # guardar la edición del día en el repositorio
  models: read      # usar GitHub Models gratis, sin API key
  pages: write      # publicar la página
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Armar el brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m radar

      - name: Guardar la edición en el historial
        run: |
          git config user.name "radar-mutuo[bot]"
          git config user.email "radar-mutuo@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Edición del $(TZ=America/Montevideo date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
